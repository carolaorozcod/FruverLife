services:

  mongo:
    image: mongo:7
    container_name: fruverlife-mongo
    restart: unless-stopped

    environment:
      MONGO_INITDB_DATABASE: inventario_db

    ports:
      - "27018:27017"

    volumes:
      - mongo_data:/data/db
      - ./database/seed.js:/docker-entrypoint-initdb.d/seed.js:ro

    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 10

  fruverlife:
    build: .
    container_name: fruverlife-app
    restart: unless-stopped

    depends_on:
      mongo:
        condition: service_healthy

    ports:
      - "8081:8081"

    environment:
      SPRING_DATA_MONGODB_URI=mongodb://host.docker.internal:27017/inventario_db:
      SPRING_DATA_MONGODB_AUTO_INDEX_CREATION: "true"

      JWT_SECRET: "MzJmRjQ5ODQxN0E2QjQ5RjYxQjM3RjA4QzE1Njc4OTA="

volumes:
  mongo_data: