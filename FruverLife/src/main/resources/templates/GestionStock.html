<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<body>

<div th:fragment="contenido">

    <h2>Gestión de Productos</h2>

    <!-- MENSAJES -->
    <div th:if="${mensaje}" class="mensaje-tabla exito">
        <span th:text="${mensaje}"></span>
    </div>

    <div th:if="${error}" class="mensaje-tabla error">
        <span th:text="${error}"></span>
    </div>

    <div class="contenedor-proveedores">

        <!-- FORMULARIO -->
        <div class="formulario">

            <form th:action="${producto != null} ? @{'/productos/editar/' + ${producto.id}} : @{/productos/guardar}"
                  method="post">

                <!-- ID oculto para editar -->
                <input type="hidden" name="id"
                       th:value="${producto != null ? producto.id : ''}">

                <label>Código:</label>
                <input type="text"
                       name="codigo"
                       th:value="${producto != null ? producto.codigo : ''}"
                       required>

                <label>Nombre:</label>
                <input type="text"
                       name="nombre"
                       th:value="${producto != null ? producto.nombre : ''}"
                       required>

                <label>Categoría:</label>
                <input type="text"
                       name="categoria"
                       th:value="${producto != null ? producto.categoria : ''}"
                       placeholder="Ej: Frutas, Verduras">

                <label>Unidad de medida:</label>
                <input type="text"
                       name="unidadMedida"
                       th:value="${producto != null ? producto.unidadMedida : ''}"
                       placeholder="Ej: kg, unidad, libra">

                <label>Precio de compra:</label>
                <input type="number" step="0.01" min="0"
                       name="precioCompra"
                       th:value="${producto != null ? producto.precioCompra : ''}"
                       required>

                <label>Precio de venta:</label>
                <input type="number" step="0.01" min="0"
                       name="precioVenta"
                       th:value="${producto != null ? producto.precioVenta : ''}"
                       required>

                <label>Cantidad:</label>
                <input type="number" step="0.01"
                       name="cantidad"
                       th:value="${producto != null ? producto.cantidad : 0}"
                       readonly>

                <button type="submit" id="btnAccion">
                    <span th:if="${producto == null}">Registrar</span>
                    <span th:if="${producto != null}">Guardar cambios</span>
                </button>

                <a th:href="@{/menu/gestion}" class="btn-cancelar">
                    Cancelar
                </a>

            </form>

        </div>

        <!-- TABLA -->
        <div class="lista">

            <h2>Productos Registrados</h2>

            <table>

                <thead>
                <tr>
                    <th>Código</th>
                    <th>Nombre</th>
                    <th>Cantidad</th>
                    <th>Precio venta</th>
                    <th>Estado</th>
                    <th>Acciones</th>
                </tr>
                </thead>

                <tbody>

                <tr th:each="p : ${productos}">

                    <td th:text="${p.codigo}"></td>

                    <td th:text="${p.nombre}"></td>

                    <td>
                        <span th:text="${p.cantidad}"></span>
                        <span th:text="${p.unidadMedida}"></span>
                    </td>

                    <td>
                        $ <span th:text="${p.precioVenta != null} ? ${#numbers.formatDecimal(p.precioVenta, 1, 'POINT', 2, 'COMMA')} : '-'"></span>
                    </td>

                    <td>
                        <span th:class="${p.estado == 'ACTIVO'} ? 'estado-activo' : 'estado-inactivo'"
                              th:text="${p.estado == 'ACTIVO' ? 'Activo' : 'Inactivo'}"></span>
                    </td>

                    <td>

                        <a th:href="@{'/productos/editar/' + ${p.id}}">
                            <button type="button" class="btn-editar">
                                ✏ Editar
                            </button>
                        </a>

                        <a th:if="${p.estado == 'ACTIVO'}"
                           th:href="@{'/productos/inactivar/' + ${p.id}}">
                            <button type="button" class="btn-inactivar">
                                Inactivar
                            </button>
                        </a>

                        <a th:if="${p.estado != 'ACTIVO'}"
                           th:href="@{'/productos/activar/' + ${p.id}}">
                            <button type="button" class="btn-activar">
                                Activar
                            </button>
                        </a>

                    </td>

                </tr>

                </tbody>

            </table>

        </div>

    </div>

</div>

</body>
</html>
