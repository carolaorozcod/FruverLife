<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Factura de Venta</title>
    <link rel="stylesheet" th:href="@{/EstiloAdmi.css}">
</head>
<body>

<div class="factura-box">

    <h1>FruverLife</h1>
    <h2>Factura de Venta</h2>

    <p><strong>N° Factura:</strong> <span th:text="${venta.factura}"></span></p>
    <p><strong>Fecha:</strong> <span th:text="${#dates.format(venta.fecha, 'dd/MM/yyyy HH:mm')}"></span></p>
    <p><strong>Cliente:</strong> <span th:text="${cliente != null} ? ${cliente.nombre} : 'No disponible'"></span></p>
    <p><strong>Cajero:</strong> <span th:text="${cajero != null} ? ${cajero.nombre} : 'No disponible'"></span></p>

    <table class="tabla">
        <thead>
        <tr>
            <th>Producto</th>
            <th>Cantidad</th>
            <th>Precio</th>
            <th>Subtotal</th>
        </tr>
        </thead>

        <tbody>
        <tr th:each="d : ${detalles}">
            <td th:text="${d.nombre}"></td>
            <td th:text="${d.cantidad}"></td>
            <td th:text="'$ ' + ${#numbers.formatDecimal(d.precioVenta, 1, 'POINT', 2, 'COMMA')}"></td>
            <td th:text="'$ ' + ${#numbers.formatDecimal(d.subtotal, 1, 'POINT', 2, 'COMMA')}"></td>
        </tr>
        </tbody>
    </table>

    <h2>Total: $ <span th:text="${#numbers.formatDecimal(venta.total, 1, 'POINT', 2, 'COMMA')}"></span></h2>

    <button onclick="window.print()">Imprimir Factura</button>

    <a th:href="@{/menu/ventas}" class="btn-principal">Volver a ventas</a>

</div>

</body>
</html>
