<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>

<div th:fragment="contenido">

    <div class="container">

        <!-- CABECERA -->
        <div class="header">
            <div>
                <h1 style="margin:0; color:#27ae60;">FruverLife</h1>
                <h1 style="...">Sistema de Desperdicios</h1>
            </div>
            <button class="btn-print" onclick="window.print()"
                    style="cursor:pointer; background:#27ae60; color:white; border:none; padding:10px 20px; border-radius:5px; font-weight:bold;">
                IMPRIMIR REPORTE
            </button>
        </div>

        <!-- RESUMEN -->
        <div class="summary-boxes" style="display:flex; gap:20px; margin-bottom:30px;">
            <div class="box box-red" style="flex:1; padding:20px; border-radius:8px; text-align:center; color:white; background:#e74c3c;">
                <div style="font-size:0.9em; opacity:0.9;">VALOR TOTAL PÉRDIDA</div>
                <h2 th:text="${'$ ' + totalGeneral}" style="margin:5px 0;">$ 0</h2>
            </div>
            <div class="box box-blue" style="flex:1; padding:20px; border-radius:8px; text-align:center; color:white; background:#3498db;">
                <div style="font-size:0.9em; opacity:0.9;">REGISTROS PROCESADOS</div>
                <h2 th:text="${registros.size()}" style="margin:5px 0;">0</h2>
            </div>
        </div>

        <!-- TABLA -->
        <div class="table-box">
            <table class="tabla" style="width:100%; border-collapse:collapse;">
                <thead>
                <tr>
                    <th>Fecha</th>
                    <th>Responsable</th>
                    <th>Detalle de Productos</th>
                    <th>Subtotal</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="reg : ${registros}">
                    <td th:text="${reg.fecha}"></td>
                    <td th:text="${reg.usuario}"></td>
                    <td>
                        <div th:each="det : ${reg.detalles}" class="product-tag"
                             style="background:#f0f0f0; padding:4px 10px; border-radius:20px; font-size:0.85em; display:inline-block; margin-right:5px; margin-bottom:5px;">
                            <span th:text="${det.nombreProducto + ' (' + det.cantidad + ')'}"></span>
                        </div>
                    </td>
                    <td th:text="'$ ' + ${reg.total}" style="font-weight:bold; color:#c0392b;"></td>
                </tr>
                <tr th:if="${#lists.isEmpty(registros)}">
                    <td colspan="4" style="text-align:center; padding:20px;">No hay registros de desperdicios</td>
                </tr>
                </tbody>
            </table>
        </div>

    </div>

</div>

</body>
</html>
