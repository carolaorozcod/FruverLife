<div class="contenido-desperdicios" th:fragment="contenido">

  <div class="card-desperdicio">

    <h2>Registro de Desperdicios</h2>

    <div th:if="${error}"
         style="color:red; font-weight:bold; background:#ffe5e5; padding:10px; border-radius:10px; margin-bottom:15px;">
      <p th:text="${error}"></p>
    </div>

    <div th:if="${mensaje}"
         style="color:green; font-weight:bold; background:#e8ffe8; padding:10px; border-radius:10px; margin-bottom:15px;">
      <p th:text="${mensaje}"></p>
    </div>

    <div class="grid-desperdicio">

      <!-- FORMULARIO -->
      <div class="form-box">

        <form th:action="@{/desperdicios/guardar}" method="post" class="form">

          <label>Nombre Producto</label>
          <input type="text" id="nombreProducto" list="listaProductos"
                 placeholder="Escriba el nombre del producto" autocomplete="off" required>
          <datalist id="listaProductos">
            <option th:each="p : ${productos}"
                    th:value="${p.nombre}"
                    th:text="${p.codigo}"
                    th:attr="data-codigo=${p.codigo},data-costo=${p.precioCompra}"></option>
          </datalist>

          <label>Código Producto</label>
          <input type="text" id="codigoProducto" name="codigo" placeholder="Se llena solo" readonly required>

          <label>Cantidad Averiada</label>
          <input type="number" name="cantidad" min="0.01" step="0.01" placeholder="Cantidad" required>

          <label>Motivo</label>
          <select name="motivo" required>
            <option value="">Seleccione un motivo</option>
            <option>Producto vencido</option>
            <option>Fruta golpeada</option>
            <option>Producto dañado</option>
            <option>Mala conservación</option>
            <option>Otro</option>
          </select>

          <label>Costo unitario</label>
          <input type="text" id="costoUnitario" value="$ 0" readonly>

          <button type="submit" id="btnDesperdicio" class="btn-principal" disabled>
            Agregar Desperdicio
          </button>

        </form>

        <script>
          (function () {
            const nombre = document.getElementById('nombreProducto');
            const lista  = document.getElementById('listaProductos');
            const codigo = document.getElementById('codigoProducto');
            const costo  = document.getElementById('costoUnitario');
            const boton  = document.getElementById('btnDesperdicio');

            function actualizar() {
              const texto = nombre.value.trim().toLowerCase();
              const opciones = Array.from(lista.options);

              let elegida = opciones.find(o => o.value.toLowerCase() === texto);

              if (!elegida && texto.length >= 2) {
                const parecidas = opciones.filter(o => o.value.toLowerCase().includes(texto));
                if (parecidas.length === 1) elegida = parecidas[0];
              }

              if (elegida) {
                codigo.value = elegida.dataset.codigo || '';
                const c = parseFloat(elegida.dataset.costo);
                costo.value = '$ ' + (isNaN(c) ? 0 : c).toLocaleString('es-CO');
                boton.disabled = false;
              } else {
                codigo.value = '';
                costo.value = '$ 0';
                boton.disabled = true;
              }
            }

            nombre.addEventListener('input', actualizar);
            nombre.addEventListener('change', actualizar);
          })();
        </script>

      </div>

      <!-- TABLA -->
      <div class="table-box">

        <h3>Desperdicios Registrados</h3>

        <table class="tabla">
          <thead>
          <tr>
            <th>Código</th>
            <th>Fecha</th>
            <th>Usuario</th>
            <th>Detalle (Cantidad / Producto)</th>
            <th>Total</th>
          </tr>
          </thead>

          <tbody>
          <tr th:each="reg : ${registros}">
            <td th:text="${reg.codigo}"></td>
            <td th:text="${#dates.format(reg.fecha, 'dd/MM/yyyy HH:mm')}"></td>
            <td th:text="${responsables.get(reg.usuarioId) ?: 'Desconocido'}"></td>

            <td>
              <div th:each="det : ${reg.detalle}">
                <span th:text="${det.cantidad}"></span>
                <span> x </span>
                <span th:text="${det.nombre}"></span>
                <br>
              </div>
              <small th:if="${reg.motivo != null and !#strings.isEmpty(reg.motivo)}"
                     th:text="'Motivo: ' + ${reg.motivo}"></small>
            </td>

            <td th:text="'$ ' + ${#numbers.formatDecimal(reg.total, 1, 'POINT', 2, 'COMMA')}"></td>
          </tr>

          <tr th:if="${#lists.isEmpty(registros)}">
            <td colspan="5">No hay registros</td>
          </tr>
          </tbody>
        </table>

        <div class="total">
          Total Pérdida:
          <span th:text="${totalGeneral != null} ? '$ ' + ${#numbers.formatDecimal(totalGeneral, 1, 'POINT', 2, 'COMMA')} : '$ 0'"></span>
        </div>

      </div>

    </div>

  </div>

</div>
