<div class="contenido-desperdicios" th:fragment="contenido">

  <div class="card-desperdicio">

    <h2>Registro de Desperdicios</h2>
    <div th:if="${error}"
         style="color:red; font-weight:bold; background:#ffe5e5; padding:10px; border-radius:10px; margin-bottom:15px;">
      <p th:text="${error}"></p>
    </div>

    <div th:if="${mensaje}"
         style="color:green; font-weight:bold; background:#e8ffe8; padding:10px; border-radius:10px; margin-bottom:15px;">
      <p th:text="${mensaje}"></p>
    </div>

    <div class="grid-desperdicio">

      <!-- FORMULARIO -->
      <div class="form-box">

        <!-- BUSCAR -->
        <form th:action="@{/desperdicios/buscar}" method="post" class="form">

          <label>Código Producto</label>
          <input type="text" name="codigo"
                 th:value="${producto?.codigo}"
                 placeholder="Ingrese código" required>

          <button type="submit" class="btn-secundario">Buscar</button>

        </form>

        <!-- REGISTRAR -->
        <form th:action="@{/desperdicios/guardar}" method="post" class="form">

          <input type="hidden" name="codigo" th:value="${producto?.codigo}">

          <label>Nombre Producto</label>
          <input type="text" th:value="${producto?.nombre}" readonly>

          <label>Cantidad Averiada</label>
          <input type="number" name="cantidad" min="0.01" step="0.01"
                 placeholder="Cantidad" required>

          <label>Motivo</label>
          <input type="text" name="motivo" placeholder="Ej: Producto dañado, vencido">

          <label>Costo unitario</label>
          <input type="text"
                 th:value="${producto != null and producto.precioCompra != null} ? '$ ' + ${#numbers.formatDecimal(producto.precioCompra, 1, 'POINT', 2, 'COMMA')} : '$ 0'"
                 readonly>

          <button type="submit"
                  class="btn-principal"
                  th:disabled="${producto == null}">
            Agregar Desperdicio
          </button>

        </form>

      </div>

      <!-- TABLA -->
      <div class="table-box">

        <h3>Desperdicios Registrados</h3>

        <table class="tabla">

          <thead>
          <tr>
            <th>Código</th>
            <th>Fecha</th>
            <th>Usuario</th>
            <th>Detalle (Cantidad / Producto)</th>
            <th>Total</th>
          </tr>
          </thead>

          <tbody>

          <tr th:each="reg : ${registros}">
            <td th:text="${reg.codigo}"></td>
            <td th:text="${#dates.format(reg.fecha, 'dd/MM/yyyy HH:mm')}"></td>
            <td th:text="${responsables[reg.usuarioId] ?: 'Desconocido'}"></td>

            <td>
              <div th:each="det : ${reg.detalle}">
                <span th:text="${det.cantidad}"></span>
                <span> x </span>
                <span th:text="${det.nombre}"></span>
                <br>
              </div>
              <small th:if="${reg.motivo != null and !#strings.isEmpty(reg.motivo)}"
                     th:text="'Motivo: ' + ${reg.motivo}"></small>
            </td>

            <td th:text="'$ ' + ${#numbers.formatDecimal(reg.total, 1, 'POINT', 2, 'COMMA')}"></td>

          </tr>

          <tr th:if="${#lists.isEmpty(registros)}">
            <td colspan="5">No hay registros</td>
          </tr>

          </tbody>

        </table>

        <div class="total">
          Total Pérdida:
          <span th:text="${totalGeneral != null} ? '$ ' + ${#numbers.formatDecimal(totalGeneral, 1, 'POINT', 2, 'COMMA')} : '$ 0'"></span>
        </div>

      </div>

    </div>

  </div>

</div>
