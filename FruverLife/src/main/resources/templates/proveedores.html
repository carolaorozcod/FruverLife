<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<body>
<div th:fragment="contenido">

    <h2>Registro de Proveedores</h2>

    <div class="contenedor-proveedores">

        <!-- FORMULARIO -->
        <div class="formulario">

            <form id="formProveedor">

                <label>NIT:</label>
                <input type="text" name="datosProveedor.nit" required>

                <label>Nombre:</label>
                <input type="text" name="nombre" required>

                <label>Número:</label>
                <input type="text" name="telefono" required>

                <label>Correo:</label>
                <input type="email" name="correo" required>

                <button type="submit" id="btnAccion">
                    Registrar
                </button>

                <button type="button" onclick="cancelarEdicion()">
                    Cancelar
                </button>

            </form>

        </div>

        <!-- TABLA -->
        <div class="lista">

            <h2>Proveedores Registrados</h2>

            <table>

                <thead>
                <tr>
                    <th>NIT</th>
                    <th>Nombre</th>
                    <th>Número</th>
                    <th>Estado</th>
                    <th>Acciones</th>
                </tr>
                </thead>

                <tbody id="tablaProveedores"></tbody>

            </table>

            <div id="mensajeTabla" class="mensaje-tabla"></div>

        </div>

    </div>

    <script>

        let idEditando = null;
        let proveedores = {}; // id -> proveedor, para editar sin pasar todo por el onclick

        document.addEventListener("DOMContentLoaded", function () {

            cargarProveedores();

            const form = document.getElementById("formProveedor");

            form.addEventListener("submit", function (e) {

                e.preventDefault();

                const datos = new FormData(this);

                let url = "/proveedores/guardar";

                if (idEditando !== null) {
                    url = "/proveedores/editar/" + idEditando;
                }

                fetch(url, {
                    method: "POST",
                    body: datos
                })
                    .then(r => r.text().then(msg => ({ ok: r.ok, msg })))
                    .then(({ ok, msg }) => {

                        mostrarMensaje(msg, ok ? "exito" : "error");

                        if (ok) {
                            form.reset();
                            idEditando = null;
                            document.getElementById("btnAccion").innerText = "Registrar";
                            cargarProveedores();
                        }
                    });

            });

        });

        function mostrarMensaje(texto, tipo) {

            const div = document.getElementById("mensajeTabla");

            div.innerText = texto;

            div.className = "mensaje-tabla " + tipo;

            div.style.display = "block";

            setTimeout(() => {
                div.style.display = "none";
            }, tipo === "error" ? 6000 : 3000);
        }

        function cargarProveedores() {

            fetch("/proveedores/listar")
                .then(r => r.json())
                .then(data => {

                    const tabla = document.getElementById("tablaProveedores");

                    tabla.innerHTML = "";
                    proveedores = {};

                    data.forEach(p => {

                        proveedores[p.id] = p;

                        const datosProv = p.datosProveedor || {};
                        const esActivo = datosProv.estado === "Activo";

                        const estadoTexto = esActivo ? "Activo" : "Inactivo";
                        const estadoClase = esActivo ? "estado-activo" : "estado-inactivo";

                        const botonEstado = esActivo
                            ? `<button class="btn-inactivar" onclick="inactivar('${p.id}')">Inactivar</button>`
                            : `<button class="btn-activar" onclick="activar('${p.id}')">Activar</button>`;

                        tabla.innerHTML += `
                        <tr>
                            <td>${datosProv.nit ?? ""}</td>
                            <td>${p.nombre ?? ""}</td>
                            <td>${p.telefono ?? ""}</td>
                            <td><span class="${estadoClase}">${estadoTexto}</span></td>
                            <td>
                                <button class="btn-editar" onclick="editar('${p.id}')">
                                    ✏ Editar
                                </button>
                                ${botonEstado}
                            </td>
                        </tr>
                    `;
                    });

                });

        }

        function editar(id) {

            const p = proveedores[id];
            if (!p) return;

            idEditando = id;

            document.querySelector("input[name='datosProveedor.nit']").value = p.datosProveedor?.nit ?? "";
            document.querySelector("input[name='nombre']").value = p.nombre ?? "";
            document.querySelector("input[name='telefono']").value = p.telefono ?? "";
            document.querySelector("input[name='correo']").value = p.correo ?? "";

            document.getElementById("btnAccion")
                .innerText = "Guardar cambios";
        }

        function cancelarEdicion() {

            document.getElementById("formProveedor").reset();

            idEditando = null;

            document.getElementById("btnAccion")
                .innerText = "Registrar";
        }

        function inactivar(id) {

            fetch("/proveedores/inactivar/" + id, {
                method: "PATCH"
            })
                .then(r => r.text().then(msg => ({ ok: r.ok, msg })))
                .then(({ ok, msg }) => {

                    mostrarMensaje(msg, ok ? "exito" : "error");

                    if (ok) {
                        cargarProveedores();
                    }
                })
                .catch(() => {
                    mostrarMensaje("Error de conexión al inactivar el proveedor.", "error");
                });

        }

        function activar(id) {

            fetch("/proveedores/activar/" + id, {
                method: "PATCH"
            })
                .then(r => r.text().then(msg => ({ ok: r.ok, msg })))
                .then(({ ok, msg }) => {

                    mostrarMensaje(msg, ok ? "exito" : "error");

                    if (ok) {
                        cargarProveedores();
                    }
                })
                .catch(() => {
                    mostrarMensaje("Error de conexión al activar el proveedor.", "error");
                });

        }

    </script>

</div>
</body>
</html>
