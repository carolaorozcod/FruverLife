<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>FruverLife - Ingreso de Mercancía</title>
</head>
<body>

<div th:fragment="contenido">

  <h2>Ingreso de Mercancía</h2>

  <!-- MENSAJES -->
  <div th:if="${mensaje}" class="mensaje-tabla exito">
    <span th:text="${mensaje}"></span>
  </div>

  <div th:if="${error}" class="mensaje-tabla error">
    <span th:text="${error}"></span>
  </div>

  <div class="contenedor-proveedores">

    <!-- FORMULARIO DE INGRESO -->
    <div class="formulario">

      <form th:action="@{/inventario/ingresar-lote}" th:object="${compra}" method="post">

        <label>Proveedor:</label>
        <select th:field="*{proveedorId}" required>
          <option value="">Seleccione</option>
          <option th:each="pr : ${proveedores}"
                  th:value="${pr.id}"
                  th:text="${pr.nombre + ' - ' + pr.datosProveedor.nit}"></option>
        </select>

        <label>Producto:</label>
        <select th:field="*{detalle[0].productoId}" required>
          <option value="">Seleccione</option>
          <option th:each="p : ${productos}"
                  th:if="${p.estado == 'ACTIVO'}"
                  th:value="${p.id}"
                  th:text="${p.codigo + ' - ' + p.nombre}"></option>
        </select>

        <label>Cantidad a Ingresar:</label>
        <input type="number"
               th:field="*{detalle[0].cantidad}"
               min="0.01" step="0.01"
               placeholder="Ej: 50"
               required>

        <label>Precio de compra:</label>
        <input type="number"
               th:field="*{detalle[0].precioCompra}"
               min="0" step="0.01"
               placeholder="Ej: 2500"
               required>

        <button type="submit" id="btnAccion">
          Registrar
        </button>

        <a th:href="@{/menu/mercancia}" class="btn-cancelar">
          Cancelar
        </a>

      </form>

    </div>

    <!-- PANEL DERECHO: ESTADO DEL SISTEMA -->
    <div class="lista">

      <h2>Estado del Sistema</h2>

      <table>
        <thead>
        <tr>
          <th>Producto</th>
          <th>Stock Actual</th>
        </tr>
        </thead>

        <tbody>
        <tr th:each="p : ${productos}">
          <td th:text="${p.nombre}">Nombre del Producto</td>
          <td>
            <!-- El stock se pone rojo si es crítico (5 o menos) -->
            <span th:text="${p.cantidad}"
                  th:style="${p.cantidad != null and p.cantidad <= 5} ? 'color: var(--rojo); font-weight: bold;' : ''">
            </span>
            <span th:text="${p.unidadMedida}"></span>
          </td>
        </tr>

        <tr th:if="${#lists.isEmpty(productos)}">
          <td colspan="2" style="text-align: center; padding: 20px;">
            No hay productos registrados para mostrar stock.
          </td>
        </tr>
        </tbody>
      </table>

    </div>

  </div>

</div>

</body>
</html>
